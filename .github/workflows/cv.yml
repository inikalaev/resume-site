name: Build and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install playwright-core
        run: npm install --no-save --no-package-lock playwright-core@1

      - name: Generate orgs.js
        env:
          ORGS_JSON: ${{ secrets.ORGS_JSON }}
        run: node tools/gen-orgs.js

      - name: Build PDFs
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/build-cv.js

      - name: Assemble dist
        run: tools/build-dist.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cv
          path: dist/cv/*.pdf
          retention-days: 30

      - name: Push dist branch
        run: |
          cd dist
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" dist
