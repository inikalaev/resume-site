* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {

img { max-width: 100%; display: block; }

.wrap { max-width: var(--wide); margin: 0 auto; padding: 0 1.5rem; }
.col { max-width: var(--measure); }

/* top bar */
.bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1.25rem 0; }
.bar nav { display: flex; gap: 1.25rem; flex-wrap: wrap; font-size: .9375rem; }
.bar nav a { color: var(--muted); text-decoration: none; }
.bar nav a:hover { color: var(--ink); }
.toggles { display: flex; gap: .5rem; }
.toggles button {
  font: 500 .875rem/1 var(--sans); color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: .45rem .8rem; cursor: pointer;
}
.toggles button:hover { border-color: var(--muted); }

/* hero */
.hero { padding: 3.5rem 0 4rem; display: grid; grid-template-columns: 1fr auto; gap: 2rem 3rem; align-items: start; }
.hero h1 { font-size: clamp(2.5rem, 6vw, 4.25rem); line-height: 1.02; letter-spacing: -.025em; font-weight: 700; margin: 0; }
.hero .role { font-size: clamp(1.25rem, 2.4vw, 1.625rem); font-weight: 500; margin: .6rem 0 0; }
.hero .sub { color: var(--muted); margin: .4rem 0 0; }
.hero .photo { width: 132px; height: 132px; border-radius: 50%; object-fit: cover; border: 1px solid var(--line); }
.quote { grid-column: 1 / -1; max-width: 40rem; font-size: clamp(1.125rem, 2vw, 1.3125rem); line-height: 1.55; margin: .5rem 0 0; }

/* the diff: единственный яркий элемент */
.diff {
  font-family: var(--mono); font-size: .9375rem; line-height: 1.5;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  overflow: hidden; margin: 0;
}
.diff .head { display: flex; justify-content: space-between; gap: 1rem; padding: .55rem 1rem; color: var(--muted); border-bottom: 1px solid var(--line); font-size: .8125rem; }
.diff .row { display: grid; grid-template-columns: 1.9rem minmax(0, 1fr); padding: .15rem 1rem; }
.diff .row.hunk { color: var(--muted); padding-top: .5rem; font-size: .92em; }
.diff .row.del { background: var(--del-bg); color: var(--del); }
.diff .row.ins { background: var(--ins-bg); color: var(--ins); }
.diff .row .sign { user-select: none; }
.diff .row .v { font-weight: 600; }
.hero .diff { grid-column: 1 / -1; max-width: 40rem; }
.hero-diff-anim .row { opacity: 0; transform: translateX(-6px); animation: row-in .35s ease-out forwards; }
@keyframes row-in { to { opacity: 1; transform: none; } }

.cta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; align-items: center; }
.btn {
  display: inline-block; font-weight: 600; text-decoration: none; padding: .7rem 1.15rem; border-radius: 8px;
  background: var(--ink); color: var(--paper); border: 1px solid var(--ink); cursor: pointer; font-size: 1rem; font-family: var(--sans);
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:hover { text-decoration: none; opacity: .88; }
.links { display: flex; flex-wrap: wrap; gap: .4rem 1.1rem; font-size: .9375rem; }

/* sections */
section { padding: 3.5rem 0; border-top: 1px solid var(--line); }
h2 { font-size: clamp(1.75rem, 3.4vw, 2.25rem); letter-spacing: -.015em; line-height: 1.15; margin: 0 0 .5rem; font-weight: 700; }
.lead { color: var(--muted); margin: 0 0 2.5rem; max-width: var(--measure); }

/* cases */
.case { padding: 2.75rem 0; }
.case + .case { border-top: 1px dashed var(--line); }
.case h3 { font-size: clamp(1.4rem, 2.6vw, 1.75rem); line-height: 1.2; letter-spacing: -.01em; margin: 0; font-weight: 700; }
.case .tag { color: var(--muted); margin: .35rem 0 .75rem; font-size: .9375rem; }
.case .impact { font-size: 1.0625rem; font-weight: 500; margin: 0 0 1.5rem; max-width: 48rem; }
.case-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 24rem); gap: 2.5rem; align-items: start; }
.case h4 { font-size: 1rem; font-weight: 600; margin: 1.5rem 0 .4rem; }
.case h4:first-child { margin-top: 0; }
.case p { margin: 0; }
.case ul { margin: 0; padding-left: 1.1rem; }
.case li { margin: .35rem 0; }
.case li::marker { color: var(--muted); }
.case .note { color: var(--muted); font-size: .9375rem; margin-top: 1rem; }
.case .facts { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1rem; padding: 0; list-style: none; }
.case .facts li { margin: 0; font-size: .875rem; padding: .2rem .6rem; border: 1px solid var(--line); border-radius: 999px; }
.case .stack { font-size: .9375rem; color: var(--muted); margin-top: 1rem; }
.case .aside { position: sticky; top: 1.5rem; display: grid; gap: 1rem; }
.case .aside .links { flex-direction: column; }

.shots { margin-top: 2rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: 1rem; }
.shots figure { margin: 0; }
.shots figure:first-child { grid-column: 1 / -1; }
.shots button { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--shot-bg); cursor: zoom-in; }
.shots img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top left; }
.shots figure:first-child img { aspect-ratio: 16 / 9; }
.shots figcaption { font-size: .8125rem; color: var(--muted); margin-top: .35rem; }
.shots.single { grid-template-columns: 1fr; }

/* more */
.more { display: grid; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); gap: 2rem 2.5rem; }
.more article h3 { font-size: 1.0625rem; margin: 0 0 .3rem; font-weight: 600; }
.more article p { margin: 0 0 .7rem; color: var(--muted); font-size: .9375rem; }
.more .diff { font-size: .8125rem; }
.totals { margin-top: 2.5rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: .5rem 1.75rem; font-size: .9375rem; }

/* experience */
.exp { list-style: none; margin: 0; padding: 0; max-width: 52rem; }
.exp li { display: grid; grid-template-columns: 10rem minmax(0, 1fr); gap: 1.5rem; padding: 1.25rem 0; }
.exp li + li { border-top: 1px solid var(--line); }
.exp .when { color: var(--muted); font-size: .9375rem; font-variant-numeric: tabular-nums; }
.exp h3 { margin: 0; font-size: 1.125rem; font-weight: 600; }
.exp .org { color: var(--muted); margin: .1rem 0 .5rem; }
.exp p { margin: 0; }
.exp .stack { color: var(--muted); font-size: .9375rem; margin-top: .4rem; }
.edu { margin-top: 2.5rem; }
.edu h3 { font-size: 1.25rem; margin: 0 0 .5rem; }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; }
.skills { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: .5rem 1.5rem; }
.skills dt { color: var(--muted); }
.skills dd { margin: 0; }
.writing { list-style: none; padding: 0; margin: 0; }
.writing li { padding: .75rem 0; }
.writing li + li { border-top: 1px solid var(--line); }
.writing .meta { display: block; color: var(--muted); font-size: .875rem; }
.now { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
@media (max-width: 860px) { .now { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .now { grid-template-columns: 1fr; } .now .tile.seek { flex-direction: column; gap: .35rem; } }
.now .tile { display: flex; flex-direction: column; gap: .35rem; padding: 1rem 1.1rem 1.1rem; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.now .k { color: var(--muted); font-size: .875rem; }
.now .v { font-weight: 500; line-height: 1.45; }
.now .tile.seek { grid-column: 1 / -1; flex-direction: row; align-items: baseline; gap: 1rem; border-color: var(--ins); background: var(--ins-bg); }
.now .tile.seek .v { font-size: 1.125rem; font-weight: 600; }
#now h2 { margin-bottom: 1.5rem; }
.now .tile.seek .k { color: var(--ins); }
h3.sub { font-size: 1.125rem; margin: .75rem 0 .5rem; font-weight: 600; }
.games-intro { margin: 0; color: var(--muted); }
#case-dialog { border: 0; padding: 0; background: transparent; width: min(46rem, 94vw); max-height: 92vh; color: var(--ink); }
#case-dialog::backdrop { background: rgba(10, 14, 22, .6); }
.cd-box { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 1.75rem 1.75rem 2rem; max-height: 92vh; overflow: auto; }
.cd-box form { float: right; margin: -.5rem -.5rem 0 1rem; }
.cd-close { font: 500 .9375rem var(--sans); background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: .4rem .9rem; cursor: pointer; }
#cd-body h3 { font-size: 1.5rem; line-height: 1.2; margin: 0; }
#cd-body .game-meta { display: block; margin: .35rem 0 1.25rem; }
#cd-body p { margin: 0 0 1rem; }
#cd-body .cd-h { font-size: .9375rem; font-weight: 600; margin: 1rem 0 .3rem; color: var(--muted); }
#cd-body .game-meta + .cd-h { margin-top: 0; }
#cd-body .shots { margin-top: 1.5rem; }
.mcard { font: inherit; text-align: left; cursor: pointer; }
.mcard .clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.mcard-res { margin-top: auto; padding-top: .5rem; font-family: var(--mono); font-size: .8125rem; color: var(--muted); }
.mcard-res del { color: var(--del); text-decoration: none; }
.mcard-res ins { color: var(--ins); text-decoration: none; }
.more-cards { margin-top: 0; }

.champ { margin-top: 2.5rem; }
.champ-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2rem; align-items: start; }
.champ-photo { margin: 0; }
.champ-photo button { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: zoom-in; background: var(--shot-bg); }
.champ-photo img { width: 100%; }
.champ-photo figcaption { font-size: .8125rem; color: var(--muted); margin-top: .35rem; }
@media (max-width: 860px) { .champ-body { grid-template-columns: 1fr; } }
.champ-title { font-weight: 600; margin: 0 0 1rem; display: flex; flex-wrap: wrap; gap: .25rem 1rem; align-items: baseline; }
.champ-title span { color: var(--muted); font-weight: 400; font-size: .9375rem; }
.champ-res { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.champ-res div { display: flex; align-items: baseline; gap: .6rem; padding: .9rem 1.1rem; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.champ-res b { font-family: var(--mono); font-size: 2rem; line-height: 1; color: var(--ins); }
.champ-res span { color: var(--muted); font-size: .9375rem; line-height: 1.35; }
.champ-text { margin: 0; padding-left: 1.1rem; }
.champ-exp-h { font-size: 1rem; font-weight: 600; margin: 1.75rem 0 .4rem; }
.champ-text li { margin: .4rem 0; }
@media (max-width: 560px) { .champ-res { grid-template-columns: 1fr; } }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1rem; margin-top: 1.5rem; }
.game { display: flex; flex-direction: column; gap: .3rem; padding: 1rem 1.1rem 1.1rem; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--surface); }
.game:hover { border-color: var(--muted); text-decoration: none; }
.game-name { font-weight: 700; font-size: 1.0625rem; color: var(--link); }
.game-meta { color: var(--muted); font-size: .875rem; }
.game-d { font-size: .9375rem; line-height: 1.5; }
.updated { color: var(--muted); font-size: .875rem; margin-top: .75rem; }

footer { padding: 3.5rem 0 5rem; border-top: 1px solid var(--line); }
footer .col p { font-size: 1.125rem; margin: 0 0 1.5rem; }

/* lightbox */
#lightbox { border: 0; padding: 0; background: transparent; max-width: min(96vw, 1600px); max-height: 94vh; }
#lightbox::backdrop { background: rgba(10, 14, 22, .82); }
#lightbox img { max-height: 86vh; width: auto; margin: 0 auto; border-radius: 6px; }
#lightbox p { color: #e4e8ef; text-align: center; margin: .6rem 0 0; font-size: .9375rem; }
#lightbox form { position: fixed; top: 1rem; right: 1rem; }
.lb-nav {
  position: fixed; top: 50%; transform: translateY(-50%); width: 3rem; height: 3rem; border-radius: 50%;
  border: 0; background: rgba(228, 232, 239, .92); color: #1a2233; font: 400 2rem/1 var(--sans); cursor: pointer;
  display: grid; place-items: center; padding-bottom: .2rem;
}
.lb-nav:hover { background: #fff; }
.lb-nav[hidden] { display: none; }
.lb-prev { left: 1rem; }
.lb-next { right: 1rem; }
#lightbox img { user-select: none; -webkit-user-drag: none; }
#lightbox form button { font: 500 .9375rem var(--sans); background: #e4e8ef; color: #1a2233; border: 0; border-radius: 999px; padding: .5rem 1rem; cursor: pointer; }

@media (max-width: 860px) {
  .case-grid, .two { grid-template-columns: 1fr; }
  .case .aside { position: static; }
  .bar nav { display: none; }
}
@media (max-width: 560px) {
  .hero { grid-template-columns: 1fr; padding-top: 1.5rem; }
  .hero .photo { width: 96px; height: 96px; grid-row: 1; }
  .exp li { grid-template-columns: 1fr; gap: .25rem; }
  .shots { grid-template-columns: 1fr 1fr; }
  .diff { font-size: .8125rem; }
  .diff .row { padding: .15rem .7rem; }
  .diff .head { flex-direction: column; gap: 0; }
  .lb-nav { top: auto; bottom: 1rem; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .hero-diff-anim .row { animation: none; opacity: 1; transform: none; }
}

.cv { display: none; }
@media print {
  @page { size: A4; margin: 12mm 14mm 12mm; }
  html, body { background: #fff !important; color: #000; }
  body { font-size: 9.5pt; line-height: 1.4; }
  .wrap, dialog { display: none !important; }
  .cv { display: block; color: #111; }
  .cv a { color: #111; text-decoration: none; }
  .cv-head { display: flex; justify-content: space-between; gap: 12pt; align-items: flex-start; border-bottom: 1.2pt solid #111; padding-bottom: 6pt; margin-bottom: 8pt; }
  .cv-head h1 { font-size: 20pt; line-height: 1.1; margin: 0; letter-spacing: -.01em; }
  .cv-head .r { font-size: 11.5pt; font-weight: 600; margin: 2pt 0 0; }
  .cv-head .s { margin: 2pt 0 0; color: #333; }
  .cv-head .c { text-align: right; font-size: 9pt; line-height: 1.5; color: #222; }
  .cv-head img { width: 58pt; height: 58pt; border-radius: 50%; object-fit: cover; }
  .cv-head .left { display: flex; gap: 10pt; align-items: center; }
  .cv-metrics { font-family: var(--mono); font-size: 8.5pt; margin: 0 0 6pt; display: flex; flex-wrap: wrap; gap: 2pt 14pt; }
  .cv-metrics b { font-weight: 600; }
  .cv h2 { font-size: 11pt; margin: 9pt 0 4pt; padding-bottom: 2pt; border-bottom: .6pt solid #999; letter-spacing: 0; }
  .cv-case { margin: 0 0 5pt; break-inside: avoid; }
  .cv-case h3 { font-size: 10pt; margin: 0; display: flex; justify-content: space-between; gap: 8pt; }
  .cv-case h3 span { font-weight: 400; color: #555; font-size: 8.5pt; white-space: nowrap; }
  .cv-case p { margin: 1pt 0 0; }
  .cv-case .res { font-family: var(--mono); font-size: 8.3pt; color: #222; margin-top: 1.5pt; }
  .cv-exp { margin: 0 0 4pt; display: grid; grid-template-columns: 30mm 1fr; gap: 8pt; break-inside: avoid; }
  .cv-exp .w { color: #555; font-size: 8.5pt; }
  .cv-exp h3 { font-size: 9.8pt; margin: 0; }
  .cv-exp p { margin: 1pt 0 0; }
  .cv-skills { margin: 0; display: grid; grid-template-columns: 34mm 1fr; gap: 1pt 8pt; }
  .cv-skills dt { color: #555; }
  .cv-skills dd { margin: 0; }
  .cv-more { margin: 0; padding-left: 10pt; columns: 2; column-gap: 14pt; }
  .cv-more li { margin: 0 0 2pt; break-inside: avoid; }
  .cv-foot { margin-top: 8pt; font-size: 8.5pt; color: #444; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <nav id="nav" aria-label="Разделы"></nav>
    <div class="toggles">
      <button id="lang-btn" type="button"></button>
      <button id="theme-btn" type="button"></button>
    </div>
  </header>
  <main id="app"></main>
</div>

<div id="cv" class="cv" aria-hidden="true"></div>

<dialog id="case-dialog" aria-labelledby="cd-title">
  <div class="cd-box">
    <form method="dialog"><button class="cd-close" id="cd-close">Закрыть</button></form>
    <div id="cd-body"></div>
  </div>
</dialog>

<dialog id="lightbox">
  <form method="dialog"><button id="lb-close">Закрыть</button></form>
  <button class="lb-nav lb-prev" id="lb-prev" type="button" aria-label="Предыдущий">‹</button>
  <img id="lb-img" alt="">
  <button class="lb-nav lb-next" id="lb-next" type="button" aria-label="Следующий">›</button>
  <p id="lb-cap"></p>
</dialog>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const params = new URLSearchParams(location.search);
  let lang = params.get("lang") || localStorage.getItem("lang") || (navigator.language || "ru").slice(0, 2);
  if (!["ru", "en"].includes(lang)) lang = "en";
  let theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  let firstRender = true;

  const pick = (o, k) => (lang === "en" && o[k + "En"] != null) ? o[k + "En"] : o[k];
  const tr = o => o == null ? "" : (typeof o === "string" ? o : (o[lang] ?? o.ru));

  function diffBlock(rows, head) {
    const body = rows.map((r, i) => `
      ${tr(r) ? `<div class="row hunk" style="animation-delay:${i * 160}ms"><span class="sign">@@</span><span>${esc(tr(r))}</span></div>` : ""}
      <div class="row del" style="animation-delay:${i * 160 + 50}ms"><span class="sign">-</span><span class="v">${esc(pick(r, "from"))}</span></div>
      <div class="row ins" style="animation-delay:${i * 160 + 100}ms"><span class="sign">+</span><span class="v">${esc(pick(r, "to"))}</span></div>`).join("");
    return `<div class="diff" role="table">${head ? `<div class="head"><span>${esc(head[0])}</span><span>${esc(head[1])}</span></div>` : ""}${body}</div>`;
  }

  function shotsBlock(c, u) {
    if (!c.shots.length) return "";
    return `<div class="shots" data-shots>${c.shots.map(s => `
      <figure data-shot>
        <button type="button" aria-label="${esc(tr(s))}. ${esc(u.zoom)}" data-src="${esc(s.src)}" data-cap="${esc(tr(s))}">
          <img src="${esc(s.src)}" alt="${esc(tr(s))}" loading="lazy" decoding="async" onerror="this.closest('[data-shot]').remove()">
        </button>
        <figcaption>${esc(tr(s))}</figcaption>
      </figure>`).join("")}</div>`;
  }


  function renderCV(u, C) {
    const arrow = r => `${pick(r, "from")} → ${pick(r, "to")} ${tr(r)}`;
    const years = e => `${tr(e.from)} – ${e.to ? tr(e.to) : u.present}`;
    $("#cv").innerHTML = `
      <div class="cv-head">
        <div class="left">
          ${lang === "ru" && DATA.photo ? `<img src="${esc(DATA.photo)}" alt="">` : ""}
          <div>
            <h1>${esc(tr(DATA.name))}</h1>
            <p class="r">${esc(u.role)}</p>
            <p class="s">${esc(u.sub)}</p>
          </div>
        </div>
        <div class="c">
          <a href="https://t.me/${C.telegram}">t.me/${C.telegram}</a><br>
          <a href="mailto:${C.email}">${C.email}</a><br>
          <a href="https://github.com/${C.github}">github.com/${C.github}</a><br>
          <a href="${esc(DATA.site)}">${esc(DATA.site.replace(/^https?:\/\//, ""))}</a>
        </div>
      </div>
      <p class="cv-metrics">${DATA.headline.map(h => `<span><b>${esc(pick(h, "from"))} → ${esc(pick(h, "to"))}</b> ${esc(tr(h))}</span>`).join("")}</p>
      <h2>${esc(u.cvCases)}</h2>
      ${DATA.cases.map(c => `
        <div class="cv-case">
          <h3>${esc(tr(c.title))}<span>${esc(tr(c.tag))}</span></h3>
          <p>${esc(tr(c.impact))}</p>
          <p class="res">${c.diff.slice(0, 2).map(r => esc(arrow(r))).join("; ")}</p>
        </div>`).join("")}
      <h2>${esc(u.moreTitle)}</h2>
      <ul class="cv-more">${DATA.more.map(m => `<li><b>${esc(m[lang].t)}.</b> ${esc(pick(m, "from"))} → ${esc(pick(m, "to"))}${m.unit ? " " + esc(tr(m.unit)) : ""}</li>`).join("")}</ul>
      <h2>${esc(u.expTitle)}</h2>
      ${DATA.experience.map(e => `
        <div class="cv-exp">
          <div class="w">${esc(years(e))}</div>
          <div><h3>${esc(tr(e.role))}, ${esc(DATA.orgs[e.org])}</h3><p>${esc(tr(e.short))}</p></div>
        </div>`).join("")}
      <h2>${esc(u.skillsTitle)}</h2>
      <dl class="cv-skills">${DATA.skills[lang].map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      <h2>${esc(u.champTitle)}</h2>
      <p style="margin:0"><b>${esc(tr(DATA.championships.title))}, ${esc(DATA.championships.years)}.</b> ${DATA.championships.results.map(r => `${esc(r.place)} ${esc(tr(r))}`).join("; ")}. ${esc(tr(DATA.championships.expert.title))}: ${DATA.championships.expert[lang].map(esc).join("; ")}.</p>
      <h2>${esc(u.gamesTitle)}</h2>
      <p style="margin:0">${DATA.games.items.map(g => `<b>${esc(g.name)}</b> (${esc(tr(g.meta))})`).join("; ")}. itch.io/zander-games</p>
      <h2>${esc(u.eduTitle)}</h2>
      ${DATA.education.map(e => `<div class="cv-exp"><div class="w">${esc(e.years)}</div><div><h3>${esc(e.org ? DATA.orgs[e.org] : tr(e.title))}</h3><p>${esc(tr(e))}</p></div></div>`).join("")}
      <p class="cv-foot">${esc(u.cvMore)}: <a href="${esc(DATA.site)}">${esc(DATA.site.replace(/^https?:\/\//, ""))}</a>. ${esc(tr(DATA.writing[0].meta))}: <a href="${esc(DATA.writing[0].href)}">${esc(DATA.writing[0].href.replace(/^https?:\/\//, ""))}</a></p>`;
  }

  function render() {
    const u = DATA.ui[lang];
    const C = DATA.contacts;
    document.documentElement.lang = lang;
    document.documentElement.dataset.theme = theme;
    document.title = `${tr(DATA.name)}, ${u.role}`;
    $("#lang-btn").textContent = lang === "ru" ? "EN" : "RU";
    $("#lang-btn").setAttribute("aria-label", lang === "ru" ? "Switch to English" : "Переключить на русский");
    $("#theme-btn").textContent = theme === "dark" ? (lang === "ru" ? "Светлая" : "Light") : (lang === "ru" ? "Тёмная" : "Dark");
    $("#lb-close").textContent = u.close;
    $("#lb-prev").setAttribute("aria-label", lang === "ru" ? "Предыдущий" : "Previous");
    $("#lb-next").setAttribute("aria-label", lang === "ru" ? "Следующий" : "Next");
    $("#nav").innerHTML = Object.entries(u.nav).map(([k, v]) => `<a href="#${k}">${esc(v)}</a>`).join("");

    const contactLinks = `
      <a class="print-url" href="https://t.me/${C.telegram}">Telegram @${C.telegram}</a>
      <a class="print-url" href="mailto:${C.email}">${C.email}</a>
      <a class="print-url" href="https://github.com/${C.github}">GitHub</a>
      <a class="print-url" href="https://habr.com/ru/users/${C.habr}/">Habr</a>`;

    const showPhoto = lang === "ru" && DATA.photo;
    const heroHead = lang === "ru" ? ["ivan-nikolaev.diff", "до и после агентов, 2025–2026"] : ["ivan-nikolaev.diff", "before and after agents, 2025–2026"];

    $("#app").innerHTML = `
      <div class="hero">
        <div>
          <h1>${esc(tr(DATA.name))}</h1>
          <p class="role">${esc(u.role)}</p>
          <p class="sub">${esc(u.sub)}</p>
        </div>
        ${showPhoto ? `<img class="photo" src="${esc(DATA.photo)}" alt="${esc(tr(DATA.name))}" width="132" height="132">` : ""}
        <p class="quote">${esc(u.quote)}</p>
        <div class="${firstRender ? "hero-diff-anim" : ""}" style="grid-column:1/-1;max-width:40rem">${diffBlock(DATA.headline, heroHead)}</div>
        <div class="cta">
          <a class="btn" href="https://t.me/${C.telegram}">${esc(u.write)}</a>
          <a class="btn ghost" href="${esc(DATA.cvFile[lang])}" download>${esc(u.cv)}</a>
          <div class="links">${contactLinks}</div>
        </div>
      </div>

      <section id="cases" aria-labelledby="cases-h">
        <h2 id="cases-h">${esc(u.casesTitle)}</h2>
        <p class="lead">${esc(u.casesLead)}</p>
        ${DATA.cases.map(c => `
          <article class="case" id="case-${c.id}">
            <h3>${esc(tr(c.title))}</h3>
            <p class="tag">${esc(tr(c.tag))}</p>
            <p class="impact">${esc(tr(c.impact))}</p>
            <div class="case-grid">
              <div>
                <h4>${esc(u.problem)}</h4>
                <p>${esc(tr(c.problem))}</p>
                <h4>${esc(u.did)}</h4>
                <ul>${c.did[lang].map(d => `<li>${esc(d)}</li>`).join("")}</ul>
                ${c.note ? `<p class="note">${esc(tr(c.note))}</p>` : ""}
              </div>
              <div class="aside">
                <h4>${esc(u.result)}</h4>
                ${diffBlock(c.diff)}
                ${c.facts ? `<ul class="facts">${c.facts[lang].map(f => `<li>${esc(f)}</li>`).join("")}</ul>` : ""}
                <p class="stack">${esc(u.stack)}: ${esc(c.stack)}</p>
                ${c.links.length ? `<div class="links">${c.links.map(l => `<a class="print-url" href="${esc(l.href)}">${esc(tr(l))}</a>`).join("")}</div>` : ""}
              </div>
            </div>
            ${shotsBlock(c, u)}
          </article>`).join("")}
      </section>

      <section id="more" aria-labelledby="more-h">
        <h2 id="more-h">${esc(u.moreTitle)}</h2>
        ${u.moreLead ? `<p class="lead">${esc(u.moreLead)}</p>` : ""}
        <div class="games more-cards">
          ${DATA.more.map((m, i) => `
            <button type="button" class="game mcard" data-more="${i}" aria-haspopup="dialog">
              <span class="game-name">${esc(m[lang].t)}</span>
              <span class="game-meta">${esc(tr(m.meta))}</span>
              <span class="game-d clamp">${esc(m[lang].d)}</span>
              <span class="mcard-res"><del>${esc(pick(m, "from"))}</del> → <ins>${esc(pick(m, "to"))}</ins></span>
            </button>`).join("")}
        </div>
      </section>

      <section id="exp" aria-labelledby="exp-h">
        <h2 id="exp-h">${esc(u.expTitle)}</h2>
        <ol class="exp">
          ${DATA.experience.map(e => `
            <li>
              <div class="when">${esc(tr(e.from))} – ${esc(e.to ? tr(e.to) : u.present)}</div>
              <div>
                <h3>${esc(tr(e.role))}</h3>
                <p class="org">${esc(DATA.orgs[e.org])}</p>
                <p>${esc(tr(e.text))}</p>
                ${e.stack ? `<p class="stack">${esc(e.stack)}</p>` : ""}
              </div>
            </li>`).join("")}
        </ol>
        <div class="edu">
          <h3>${esc(u.eduTitle)}</h3>
          <ol class="exp">
            ${DATA.education.map(e => `
              <li><div class="when">${esc(e.years)}</div><div><h3>${esc(e.org ? DATA.orgs[e.org] : tr(e.title))}</h3><p class="org">${esc(tr(e))}</p></div></li>`).join("")}
          </ol>
        </div>
        <div class="edu">
          <h3>${esc(u.skillsTitle)}</h3>
          <dl class="skills">${DATA.skills[lang].map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
        </div>
      </section>

      <section id="writing" aria-labelledby="writing-h">
        <h2 id="writing-h">${esc(u.writingTitle)}</h2>
        <div class="two">
          <div>
            <h3 class="sub">${esc(u.libsTitle)}</h3>
            <ul class="writing">
              ${DATA.writing.map(w => `<li><a class="print-url" href="${esc(w.href)}">${esc(tr(w))}</a><span class="meta">${esc(tr(w.meta))}</span></li>`).join("")}
            </ul>
          </div>
          <div>
            <h3 class="sub">${esc(u.gamesTitle)}</h3>
            <p class="games-intro">${esc(tr(DATA.games.intro))}</p>
          </div>
        </div>
        <div class="games">
          ${DATA.games.items.map(g => `
            <a class="game" href="${esc(g.href)}">
              <span class="game-name">${esc(g.name)}</span>
              <span class="game-meta">${esc(tr(g.meta))}</span>
              <span class="game-d">${esc(tr(g.d))}</span>
            </a>`).join("")}
        </div>
        <div class="champ">
          <h3 class="sub">${esc(u.champTitle)}</h3>
          <p class="champ-title">${esc(tr(DATA.championships.title))}<span>${esc(DATA.championships.years)}</span></p>
          <div class="champ-res">${DATA.championships.results.map(r => `<div><b>${esc(r.place)}</b><span>${esc(tr(r))}</span></div>`).join("")}</div>
          <div class="champ-body">
            <ul class="champ-text">${DATA.championships.text[lang].map(t => `<li>${esc(t)}</li>`).join("")}</ul>
            <figure class="champ-photo" data-shots>
              <button type="button" data-src="${esc(DATA.championships.photo.src)}" data-cap="${esc(tr(DATA.championships.photo))}" aria-label="${esc(tr(DATA.championships.photo))}. ${esc(u.zoom)}">
                <img src="${esc(DATA.championships.photo.src)}" alt="${esc(tr(DATA.championships.photo))}" loading="lazy">
              </button>
              <figcaption>${esc(tr(DATA.championships.photo))}</figcaption>
            </figure>
          </div>
          <h4 class="champ-exp-h">${esc(tr(DATA.championships.expert.title))}</h4>
          <ul class="champ-text">${DATA.championships.expert[lang].map(t => `<li>${esc(t)}</li>`).join("")}</ul>
        </div>
      </section>

      <section id="now" aria-labelledby="now-h">
        <h2 id="now-h">${esc(u.nowTitle)}</h2>
        <div class="now">${DATA.now.map((n, i) => `<div class="tile${i === DATA.now.length - 1 ? " seek" : ""}"><span class="k">${esc(tr(n.k))}</span><span class="v">${esc(tr(n.v))}</span></div>`).join("")}</div>
        <p class="updated">${esc(u.updated)}</p>
      </section>

      <footer>
        <div class="col">
          <h2>${esc(u.contactTitle)}</h2>
          <p>${esc(u.contactLead)}</p>
          <div class="cta"><a class="btn" href="https://t.me/${C.telegram}">${esc(u.write)}</a><div class="links">${contactLinks}</div></div>
        </div>
      </footer>`;

    renderCV(u, C);
    document.querySelectorAll("[data-shots]").forEach(el => {
      const n = el.querySelectorAll("[data-shot]").length;
      if (n === 1) el.classList.add("single");
    });
    firstRender = false;
  }

  let lbList = [], lbIdx = 0;
  function lbShow(i) {
    lbIdx = (i + lbList.length) % lbList.length;
    const b = lbList[lbIdx];
    $("#lb-img").src = b.dataset.src;
    $("#lb-img").alt = b.dataset.cap;
    $("#lb-cap").textContent = lbList.length > 1 ? `${b.dataset.cap}  ${lbIdx + 1} / ${lbList.length}` : b.dataset.cap;
    $("#lb-prev").hidden = $("#lb-next").hidden = lbList.length < 2;
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-src]");
    if (!b) return;
    lbList = [...b.closest("[data-shots]").querySelectorAll("[data-src]")];
    lbShow(lbList.indexOf(b));
    $("#lightbox").showModal();
  });
  document.addEventListener("click", e => {
    const c = e.target.closest("[data-more]");
    if (!c) return;
    const m = DATA.more[+c.dataset.more];
    const u = DATA.ui[lang];
    $("#cd-close").textContent = u.close;
    $("#cd-body").innerHTML = `
      <h3 id="cd-title">${esc(m[lang].t)}</h3>
      <span class="game-meta">${esc(tr(m.meta))}</span>
      ${m.details ? [u.dWas, u.dDid, u.dGot].map((h, k) => `<h4 class="cd-h">${esc(h)}</h4><p>${esc(m.details[lang][k])}</p>`).join("") : `<p>${esc(m[lang].d)}</p>`}
      ${diffBlock([{ ru: m.unit ? m.unit.ru : "", en: m.unit ? m.unit.en : "", from: m.from, to: m.to, fromEn: m.fromEn, toEn: m.toEn }])}
      ${m.shots && m.shots.length ? shotsBlock(m, u) : ""}`;
    $("#case-dialog").showModal();
  });
  $("#case-dialog").addEventListener("click", e => { if (e.target.id === "case-dialog") e.target.close(); });
  $("#lb-prev").addEventListener("click", () => lbShow(lbIdx - 1));
  $("#lb-next").addEventListener("click", () => lbShow(lbIdx + 1));
  $("#lightbox").addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") { e.preventDefault(); lbShow(lbIdx - 1); }
    if (e.key === "ArrowRight") { e.preventDefault(); lbShow(lbIdx + 1); }
  });
  let touchX = null;
  $("#lightbox").addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
  $("#lightbox").addEventListener("touchend", e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 40) lbShow(lbIdx + (dx < 0 ? 1 : -1));
    touchX = null;
  });
  $("#lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") e.target.close(); });

  $("#lang-btn").addEventListener("click", () => {
    lang = lang === "ru" ? "en" : "ru";
    localStorage.setItem("lang", lang);
    render();
  });
  $("#theme-btn").addEventListener("click", () => {
    theme = theme === "dark" ? "light" : "dark";
    localStorage.setItem("theme", theme);
    render();
  });

  render();
})();
</script>
</body>
</html>
